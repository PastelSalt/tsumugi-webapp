name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server (lint, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Server/package-lock.json
      - run: npm ci --prefix Server
      - run: npm run lint --prefix Server
      # The tests start a throwaway in-memory MongoDB; the engine is downloaded on first use.
      - run: npm test --prefix Server
      - run: npm audit --omit=dev --audit-level=high --prefix Server

  client:
    name: Client (lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client
      - run: npm run lint --prefix client
      - run: npm run build --prefix client
      - run: npm audit --omit=dev --audit-level=high --prefix client
